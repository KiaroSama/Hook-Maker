name: Task finalization regressions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: task-finalization-${{ github.ref }}
  cancel-in-progress: true
jobs:
  task-identity:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    steps:
      - uses: actions/checkout@v7
      - name: Native task and ledger regression cases
        shell: ${{ matrix.shell }}
        run: ./scripts/regression/Test-TaskIdentityIsolation.ps1 -ResultPath '${{ runner.temp }}/task-evidence/results.json'
      - name: Archive exact tested source
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force '${{ runner.temp }}/task-evidence' | Out-Null
          git archive --format=zip --output='${{ runner.temp }}/task-evidence/source.zip' HEAD
          git rev-parse HEAD | Set-Content -Encoding utf8 '${{ runner.temp }}/task-evidence/commit.txt'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-evidence-${{ matrix.shell }}
          path: ${{ runner.temp }}/task-evidence
          retention-days: 3
          if-no-files-found: error
