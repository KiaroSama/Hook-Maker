name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # The real sync-hooks.json is machine-local (git-ignored); the tracked
      # example is what ships, so that is what CI validates.
      - name: Validate sync-hooks.example.json
        shell: pwsh
        run: .\scripts\Validate-Config.ps1 -ConfigPath .\sync-hooks.example.json

      - name: Parse-check all PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors) {
              $failed = $true
              foreach ($e in $parseErrors) {
                Write-Error "$($_.FullName):$($e.Extent.StartLineNumber): $($e.Message)"
              }
            }
          }
          if ($failed) { exit 1 }

      # The engine must work under both hosts: Claude Code's installed command
      # uses powershell.exe (5.1), Codex's uses pwsh (7).
      - name: Engine smoke test (PowerShell 7)
        shell: pwsh
        run: .\scripts\Test-Engine.ps1

      - name: Engine smoke test (Windows PowerShell 5.1)
        shell: powershell
        run: .\scripts\Test-Engine.ps1

      # Offline GitHub-hook suite: mocks git state and gh via a PATH shim, so it
      # needs no network or account. It internally exercises Windows PowerShell
      # 5.1 too, so one pwsh run covers both hosts.
      - name: GitHub hooks test suite
        shell: pwsh
        run: .\scripts\Test-GitHubHooks.ps1

      # RulesCheck hook + per-client (-ClaudeOnly/-CodexOnly) install targeting.
      # Offline: fake home/state dirs via env vars, no network.
      - name: RulesCheck and client-targeting test suite
        shell: pwsh
        run: .\scripts\Test-RulesCheck.ps1

      # Drives the interactive wizard end-to-end via stdin (menu structure, hook
      # listing, client splat, real Install-Hook writes) against temp projects.
      - name: Wizard functional test suite
        shell: pwsh
        run: .\scripts\Test-Wizard.ps1

      # Secrets-Check hook: auto-append/placeholder/ignore/tracked/staged/leak/
      # unused checks against real throwaway git repos. Offline, no network.
      - name: Secrets-Check test suite
        shell: pwsh
        run: .\scripts\Test-SecretsCheck.ps1

      # Ai-Memory-Load (injects .ai/memory.md pre-task) + Graph-Read-Check
      # (suggests graphify queries when a graph exists). Offline, no network.
      - name: Ai-Memory-Load and Graph-Read-Check test suite
        shell: pwsh
        run: .\scripts\Test-AiMemoryLoad.ps1
