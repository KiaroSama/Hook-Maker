name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push supersedes an in-flight run for the same ref instead of paying
# for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast static gate, kept on windows-latest ON PURPOSE. Linux minutes are 10x
  # cheaper and this job only parses text, but the scripts use Windows-style
  # paths throughout (e.g. Join-Path ... 'hooks\_hooklib.ps1'), which pwsh on
  # Linux resolves as literal single-segment filenames. Moving it would need a
  # verified cross-platform path pass first.
  static:
    runs-on: windows-latest
    # Ceilings, not expected durations. This job only parses text and validates
    # config; it finishes in well under a minute locally. A hung parse means a
    # defect, not a slow machine, so the ceiling is deliberately tight.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The real sync-hooks.json is machine-local (git-ignored); the tracked
      # example is what ships, so that is what CI validates.
      - name: Validate sync-hooks.example.json
        shell: pwsh
        run: .\scripts\Validate-Config.ps1 -ConfigPath .\sync-hooks.example.json

      - name: Parse-check all PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors) {
              $failed = $true
              foreach ($e in $parseErrors) {
                Write-Error "$($_.FullName):$($e.Extent.StartLineNumber): $($e.Message)"
              }
            }
          }
          if ($failed) { exit 1 }

      # The bucket lists in the `suites` matrix below are hand-maintained, so a
      # newly added Test-*.ps1 silently never runs in CI unless someone
      # remembers to add it - which is exactly how Test-InstalledHooksMenu and
      # Test-StatePersistence were once written, passing locally, while CI kept
      # reporting green over a matrix that never executed them. Locally
      # scripts\Run-Tests.ps1 globs the directory and cannot drift this way;
      # this step gives CI the same guarantee by failing on any suite file that
      # no bucket claims.
      - name: Every test suite is covered by a CI bucket
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $onDisk = @(Get-ChildItem -LiteralPath 'scripts' -Filter 'Test-*.ps1' -File | ForEach-Object { $_.BaseName })
          $workflow = Get-Content -LiteralPath '.github\workflows\ci.yml' -Raw
          # [^\r\n]+ deliberately, not \s*(.+)$: in .NET `.` matches \r, so the
          # looser form swallows the line break after the bare `suites:` job key
          # and captures the NEXT line instead.
          $inMatrix = @([regex]::Matches($workflow, '(?m)^[ \t]*suites:[ \t]*([^\r\n]+)') |
            ForEach-Object { $_.Groups[1].Value.Split(',') } |
            ForEach-Object { $_.Trim() } | Where-Object { $_ })
          # Test-Engine runs in its own job (both hosts), not in a bucket.
          $covered = $inMatrix + @('Test-Engine')
          $missing = @($onDisk | Where-Object { $covered -notcontains $_ })
          $stale = @($inMatrix | Where-Object { $onDisk -notcontains $_ })
          if ($missing.Count -gt 0) { Write-Error ("Test suites not in any CI bucket: " + ($missing -join ', ')) }
          if ($stale.Count -gt 0) { Write-Error ("CI buckets name suites that do not exist: " + ($stale -join ', ')) }
          if ($missing.Count -gt 0 -or $stale.Count -gt 0) { exit 1 }
          Write-Host ("All " + $onDisk.Count + " suite(s) are covered by a CI job.") -ForegroundColor Green

  # The engine must work under both hosts: Claude Code's installed command uses
  # powershell.exe (5.1), Codex's uses pwsh (7).
  engine:
    runs-on: windows-latest
    # Test-Engine runs ~11s locally per host, twice here (pwsh 7 + 5.1).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Engine smoke test (PowerShell 7)
        shell: pwsh
        run: .\scripts\Test-Engine.ps1
      - name: Engine smoke test (Windows PowerShell 5.1)
        shell: powershell
        run: .\scripts\Test-Engine.ps1
      # The anti-loop ledger decides whether a gate may force another answer, so
      # a host-specific defect in it is a continuation storm on that host and
      # nothing on the other. It ran on pwsh 7 only (its suites bucket); the 5.1
      # run below is what proved File.Replace needs [NullString]::Value rather
      # than $null, which 7 tolerates no better but only this job would catch on
      # a host the suites matrix never exercises.
      - name: Stop ledger, anti-loop admission (Windows PowerShell 5.1)
        shell: powershell
        run: .\scripts\Test-StopLedger.ps1

  # The suites run as PARALLEL BUCKETS rather than one long serial job.
  #
  # Why buckets and not one job per suite: every job pays its own runner start
  # and checkout, and Windows minutes bill at 10x, so one job per suite would
  # cost far more than it is worth. Five balanced buckets keep almost all of the
  # wall-clock win at a fraction of that overhead.
  #
  # Each bucket leads with one of the slow, process-spawning suites so the
  # buckets finish at roughly the same time. Suites that create throwaway
  # fixtures under the real hooks\ directory are safe here: each bucket is its
  # own runner with its own checkout, and within a bucket the suites run one
  # after another. (Locally that isolation does not exist - see
  # scripts\Run-Tests.ps1, which splits exclusive from isolated suites.)
  suites:
    runs-on: windows-latest
    # The heaviest bucket sums to ~7 minutes of measured LOCAL wall time run
    # back-to-back; a CI runner is slower, so this leaves roughly 3x headroom.
    # The bucket ceiling is the OUTER bound; each suite ALSO gets its own
    # per-suite wall timeout below, so one hung suite cannot consume the whole
    # bucket and starve the suites after it.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: registry
            suites: Test-InstallRegistry,Test-InstallRegistrySchema,Test-InstallInvoke,Test-InstalledRuntimeMigration,Test-LegacyDiscovery,Test-StatePersistence,Test-InstalledHooksMenu,Test-HookStatusDiscovery,Test-TestPlanCheck,Test-TestPlanScanner
          - name: uninstall
            suites: Test-UninstallHook,Test-NativePrePushInstall,Test-RulesCheck,Test-DiscoveredUninstall,Test-HookStatusScan,Test-TestCompletionCheck,Test-CbmHooks
          - name: wizard
            suites: Test-Wizard,Test-ContextHooks,Test-GraphUpdateCheck,Test-TestRunGuard,Test-RunTests,Test-TimingHistory,Test-SyncGroupMerge,Test-CleanupFreshness
          - name: secrets
            suites: Test-SecretsCheck,Test-IgnoreRulesCheck,Test-GitSyncCheck,Test-AiMemoryCheck,Test-LargeFileCheck,Test-Utf8EncodingCheck,Test-FeatureRequestCheck
          - name: hooks
            suites: Test-StopLedger,Test-DocsFreshnessCheck,Test-CloudflareDeploy,Test-DependencyVersionCheck,Test-TestTempCleanup,Test-DependabotCheck,Test-CiStatusCheck,Test-GithubBaselineCheck,Test-AiMemoryLoad,Test-SynapseRulesCheck,Test-SessionSummaryCheck,Test-SpeckitCheck
    name: suites (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7
      - name: Run ${{ matrix.name }} suites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # Per-suite wall ceiling. Real suites finish well under this even on a
          # slow runner (the heaviest is ~5 min locally); a suite that HANGS -
          # blocks on stdin, deadlocks, spins forever - is killed here instead of
          # eating the 30-minute bucket and starving every suite after it.
          $perSuiteTimeoutSeconds = 900
          # Snapshot a process's descendant tree (root + all descendants) WITH each
          # process's start time, taken BEFORE a kill. After the kill a survivor is
          # proven by pid AND start time - a recycled pid pointing at a different
          # process (different start time) is NOT a survivor. `Ok=$false` means the
          # CIM query itself failed, i.e. the tree could NOT be enumerated: that is
          # an UNPROVEN cleanup that must fail the job, never a silent all-clear.
          function Get-ProcessTreeSnapshot {
            param([int]$RootPid, [datetime]$RootStart)
            $ok = $true
            $procs = @()
            try { $procs = @(Get-CimInstance Win32_Process -ErrorAction Stop | Select-Object ProcessId, ParentProcessId, CreationDate) }
            catch { $ok = $false; $procs = @() }
            $members = New-Object System.Collections.Generic.List[object]
            [void]$members.Add([pscustomobject]@{ Pid = $RootPid; Start = $RootStart })
            $seen = @{ "$RootPid" = $true }
            $queue = New-Object System.Collections.Generic.Queue[int]
            $queue.Enqueue($RootPid)
            while ($queue.Count -gt 0) {
              $cur = $queue.Dequeue()
              foreach ($pr in $procs) {
                $cid = [int]$pr.ProcessId
                if ([int]$pr.ParentProcessId -eq $cur -and -not $seen.ContainsKey("$cid")) {
                  $seen["$cid"] = $true
                  [void]$members.Add([pscustomobject]@{ Pid = $cid; Start = $pr.CreationDate })
                  $queue.Enqueue($cid)
                }
              }
            }
            return [pscustomobject]@{ Ok = $ok; Members = $members.ToArray() }
          }
          $failed = @()
          foreach ($suite in ('${{ matrix.suites }}'.Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ })) {
            $path = Join-Path 'scripts' ($suite + '.ps1')
            if (-not (Test-Path -LiteralPath $path)) { Write-Error "Suite not found: $path"; $failed += $suite; continue }
            Write-Host "=== $suite (<= ${perSuiteTimeoutSeconds}s) ===" -ForegroundColor Cyan
            # Each suite is its own child process with stdin DETACHED (a suite
            # that reads input gets EOF, never a hang) and a bounded wall wait.
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = (Get-Process -Id $PID).Path
            foreach ($a in @('-NoLogo', '-NoProfile', '-File', $path)) { [void]$psi.ArgumentList.Add($a) }
            $psi.UseShellExecute = $false
            $psi.RedirectStandardInput = $true
            $p = [System.Diagnostics.Process]::Start($psi)
            try { $p.StandardInput.Close() } catch { }
            if (-not $p.WaitForExit($perSuiteTimeoutSeconds * 1000)) {
              Write-Error ("TIMEOUT: $suite exceeded ${perSuiteTimeoutSeconds}s - terminating its process tree")
              # Snapshot the owned tree WITH start times BEFORE the kill. taskkill /T
              # /F returns before the tree is gone, so after the wait every recorded
              # (pid, start) must be gone - a match on pid AND start time is a real
              # survivor, a recycled pid is not. If the tree could not be enumerated
              # (CIM failure) the cleanup is UNPROVEN and fails, never a silent ok.
              $rootStart = [datetime]::MinValue
              try { $rootStart = $p.StartTime } catch { }
              $snap = Get-ProcessTreeSnapshot -RootPid $p.Id -RootStart $rootStart
              $killExit = -1
              try { & taskkill.exe /PID $p.Id /T /F *> $null; $killExit = $LASTEXITCODE } catch { $killExit = -1 }
              try { [void]$p.WaitForExit(15000) } catch { }
              $survivors = @()
              foreach ($m in $snap.Members) {
                try {
                  $live = Get-Process -Id $m.Pid -ErrorAction SilentlyContinue
                  if ($live) {
                    # Same pid AND same start time (within 2s) => genuinely still
                    # alive. A recycled pid (different start) is not our process.
                    $sameStart = $true
                    try { $sameStart = ([Math]::Abs(($live.StartTime - [datetime]$m.Start).TotalSeconds) -lt 2) } catch { $sameStart = $true }
                    if ($sameStart) { $survivors += $m.Pid }
                  }
                }
                catch { }
              }
              $rootAlive = $true
              try { $rootAlive = -not $p.HasExited } catch { $rootAlive = $false }
              if ($rootAlive -or $killExit -ne 0 -or $survivors.Count -gt 0 -or -not $snap.Ok) {
                $failed += ($suite + " (timed out; kill exit=$killExit, rootAlive=$rootAlive, treeEnumerated=$($snap.Ok), survivors=" + ($survivors -join ',') + " - process tree cleanup NOT proven)")
              }
              else {
                $failed += ($suite + " (timed out; process tree of " + $snap.Members.Count + " pid(s) proven terminated)")
              }
              try { $p.Dispose() } catch { }
              continue
            }
            $suiteExit = $p.ExitCode
            try { $p.Dispose() } catch { }
            if ($suiteExit -ne 0) { $failed += ($suite + ' (' + $suiteExit + ' failed assertion(s))') }
          }
          if ($failed.Count -gt 0) {
            Write-Error ("FAILED: " + ($failed -join ', '))
            exit 1
          }
          Write-Host 'All suites in this bucket passed.' -ForegroundColor Green
