name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # The real sync-hooks.json is machine-local (git-ignored); the tracked
      # example is what ships, so that is what CI validates.
      - name: Validate sync-hooks.example.json
        shell: pwsh
        run: .\scripts\Validate-Config.ps1 -ConfigPath .\sync-hooks.example.json

      - name: Parse-check all PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors) {
              $failed = $true
              foreach ($e in $parseErrors) {
                Write-Error "$($_.FullName):$($e.Extent.StartLineNumber): $($e.Message)"
              }
            }
          }
          if ($failed) { exit 1 }

      # The engine must work under both hosts: Claude Code's installed command
      # uses powershell.exe (5.1), Codex's uses pwsh (7).
      - name: Engine smoke test (PowerShell 7)
        shell: pwsh
        run: .\scripts\Test-Engine.ps1

      - name: Engine smoke test (Windows PowerShell 5.1)
        shell: powershell
        run: .\scripts\Test-Engine.ps1

      # Offline GitHub-hook suite: mocks git state and gh via a PATH shim, so it
      # needs no network or account. It internally exercises Windows PowerShell
      # 5.1 too, so one pwsh run covers both hosts.
      - name: GitHub hooks test suite
        shell: pwsh
        run: .\scripts\Test-GitHubHooks.ps1

      # RulesCheck hook + per-client (-ClaudeOnly/-CodexOnly) install targeting.
      # Offline: fake home/state dirs via env vars, no network.
      - name: RulesCheck and client-targeting test suite
        shell: pwsh
        run: .\scripts\Test-RulesCheck.ps1

      # Drives the interactive wizard end-to-end via stdin (menu structure, hook
      # listing, client splat, real Install-Hook writes) against temp projects.
      - name: Wizard functional test suite
        shell: pwsh
        run: .\scripts\Test-Wizard.ps1

      # Secrets-Check hook: auto-append/placeholder/ignore/tracked/staged/leak/
      # unused checks against real throwaway git repos. Offline, no network.
      - name: Secrets-Check test suite
        shell: pwsh
        run: .\scripts\Test-SecretsCheck.ps1

      # Ai-Memory-Load (injects .ai/memory.md + lists the rest of .ai/ pre-task)
      # + Graph-Read-Check (suggests graphify queries when a graph exists).
      # Offline, no network.
      - name: Ai-Memory-Load and Graph-Read-Check test suite
        shell: pwsh
        run: .\scripts\Test-AiMemoryLoad.ps1

      # Ai-Memory-Check post-task staleness trigger, real throwaway git repos.
      # Offline, no network.
      - name: Ai-Memory-Check test suite
        shell: pwsh
        run: .\scripts\Test-AiMemoryCheck.ps1

      # Mcp-Usage-Check + Skills-Check pre-task reminders. Offline, no network.
      - name: Context hooks test suite (Mcp-Usage-Check, Skills-Check)
        shell: pwsh
        run: .\scripts\Test-ContextHooks.ps1

      - name: Ignore-Rules-Check test suite
        shell: pwsh
        run: .\scripts\Test-IgnoreRulesCheck.ps1

      # Git-Sync-Check hook: mandatory Stop instruction, fingerprint+session
      # gating, SessionStart/UserPromptSubmit context. Real throwaway git
      # repos + bare remotes, no network.
      - name: Git-Sync-Check test suite
        shell: pwsh
        run: .\scripts\Test-GitSyncCheck.ps1

      # Dependency-Version-Check hook: npm/pip outdated classification, GitHub
      # Actions/runtime-pin/Docker static checks, cache/fingerprint gating.
      # npm/pip are PATH-shimmed (same convention as the gh shim) - no live
      # registry calls in CI.
      - name: Dependency-Version-Check test suite
        shell: pwsh
        run: .\scripts\Test-DependencyVersionCheck.ps1

      # Cloudflare-Deploy hook: deployment-worthiness/environment/pre-deploy
      # review/post-deploy verification/failure-handling wording, cooldown,
      # and the release-readiness gate (clean/pushed/CI-green/cleanup-state).
      # Offline, no network (real bare-remote pushes + a PATH-shimmed gh),
      # never actually deploys.
      - name: Cloudflare-Deploy test suite
        shell: pwsh
        run: .\scripts\Test-CloudflareDeploy.ps1

      # Graph-Update-Check hook: structural-impact criteria (not file count),
      # staleness detection, cooldown. Offline, no network.
      - name: Graph-Update-Check test suite
        shell: pwsh
        run: .\scripts\Test-GraphUpdateCheck.ps1

      # Test-Temp-Cleanup hook: safe-candidate deletion + rescan verification,
      # tracked/staged/reparse-point/hard-protected-root preservation,
      # review-only-by-default, limits, locked-candidate no-loop guarantee.
      # Offline, no network; never runs git clean/reset.
      - name: Test-Temp-Cleanup test suite
        shell: pwsh
        run: .\scripts\Test-TestTempCleanup.ps1

      # Docs-Freshness-Check hook: SessionStart baseline, Stop task-delta
      # detection (comment/blank-only changes excluded), hard exclusions,
      # ranked tracked-doc candidates, and the fingerprint-bound Updated/
      # NoUpdate acknowledgement flow. Offline, no network.
      - name: Docs-Freshness-Check test suite
        shell: pwsh
        run: .\scripts\Test-DocsFreshnessCheck.ps1

      # Install registry + "Update previously installed hooks": single/multi/
      # config-based/generated/sync-engine installs tracked without
      # duplication, byte-for-byte refresh preserving events/client/target/
      # scope/profile, never-installed hooks never added, missing source/
      # target reported and skipped, idempotent second run, no secret/.env/
      # prompt content ever stored. Also covers installed-state drift with no
      # source change (deleted/modified runtime, stale shared _hooklib,
      # removed/moved/duplicated registration, one wiped client), the managed
      # manifest (.env + copied helpers + added/removed files, runtime-
      # generated files ignored), per-client Claude/Codex semantics preserved
      # independently, v1 -> v2 record migration, native pre-push repair of a
      # deliberately corrupted companion with the user's previous hook left
      # byte-for-byte intact, and corrupt-registry quarantine + locked
      # concurrent writes. Offline, no network; isolates the registry away
      # from this checkout's own state\.
      - name: Install registry / update-installed-hooks test suite
        shell: pwsh
        run: .\scripts\Test-InstallRegistry.ps1

      - name: Registry schema / isolation / path-safety test suite
        shell: pwsh
        run: .\scripts\Test-InstallRegistrySchema.ps1
