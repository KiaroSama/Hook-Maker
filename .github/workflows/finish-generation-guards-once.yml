name: Finish generation guards once
on:
  push:
    branches: [fix/generation-observation-retention-20260921]
    paths: [.github/workflows/finish-generation-guards-once.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'KiaroSama/Hook-Maker' && github.actor == 'KiaroSama'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply guarded edits to this PR only and remove this publisher
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 02ca4b33f1e3865b041d9eb1b85b2b84f7141f0c HEAD -- hooks/Session-Summary-Check/_generation.ps1 scripts/regression/Test-GenerationSafety.ps1 .github/workflows/generation-safety.yml
          python - <<'PY'
          from pathlib import Path
          def replace(name, old, new):
              p=Path(name)
              raw=p.read_bytes()
              text=raw.decode('utf-8-sig').replace('\r\n','\n')
              if text.count(old)!=1: raise RuntimeError('Ambiguous source target: '+name)
              text=text.replace(old,new)
              newline='\r\n' if b'\r\n' in raw else '\n'
              p.write_bytes((b'\xef\xbb\xbf' if raw.startswith(b'\xef\xbb\xbf') else b'')+text.replace('\n',newline).encode('utf-8'))
          name='hooks/Session-Summary-Check/_generation.ps1'
          replace(name, '#    that already finished. Neither client exposes a way to withhold a response.', '#    that already finished. This observer cannot withhold a displayed response.')
          replace(name, '    foreach ($name in @($Objections)) {', '''    # Old records may carry a terminal label without verified publication.
              # Preserve those bytes for review, but never turn the label into proof.
              if ($Entry.state -ceq 'finalized' -and ($null -eq $Entry.publication -or -not $Entry.publication.ready)) {
                  [void]$missing.Add('publication-unverified')
              }
              foreach ($name in @($Objections)) {'''.replace('\n          ','\n'))
          replacement='''    $hLegacy = New-Task 'legacy-finalized'
              $legacyDoc = New-Doc $hLegacy
              $legacyEntry = New-Entry (Get-CurrentUserTaskIdentity $hLegacy).TaskId 'finalized'
              $legacyEntry.publication = $null
              $legacyDoc.generations = @($legacyEntry)
              Put-Doc $hLegacy $legacyDoc
              Case 'G15 a legacy finalized label without publication is not readiness' {
                  -not (Test-GenerationReady $hLegacy).Ready
              } $true
              $hFresh = New-Task 'forged-finalized'
              $forged = Set-GenerationState $hFresh 'finalized' 'a label is not a receipt'
              Case 'R10 a fresh task cannot be finalized without a verified publication' {
                  -not $forged.Ok -and -not [IO.File]::Exists((Get-Path $hFresh))
              } $true

              $h = New-Task 'terminal'; $null = Set-GenerationState $h 'ready' 'proof' '''.replace('\n          ','\n').rstrip()
          replace('scripts/regression/Test-GenerationSafety.ps1', "    $h = New-Task 'terminal'; $null = Set-GenerationState $h 'ready' 'proof'", replacement)
          replace('.github/workflows/generation-safety.yml', "{ 27 } else { 0 }", "{ 29 } else { 0 }")
          replace('.github/workflows/generation-safety.yml', '$report.cases.Count -ne 35', '$report.cases.Count -ne 37')
          PY
          pwsh -NoProfile -Command '$bad=@(); foreach($p in @("hooks/Session-Summary-Check/_generation.ps1","scripts/regression/Test-GenerationSafety.ps1")){ $e=$null; $null=[Management.Automation.Language.Parser]::ParseFile((Join-Path (Get-Location) $p),[ref]$null,[ref]$e);$bad+=$e };if($bad.Count){$bad|Format-List;exit 1}'
          git add hooks/Session-Summary-Check/_generation.ps1 scripts/regression/Test-GenerationSafety.ps1 .github/workflows/generation-safety.yml
          git rm .github/workflows/finish-generation-guards-once.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: refuse legacy terminal labels as readiness without a verified publication'
          git push origin HEAD:refs/heads/fix/generation-observation-retention-20260921
