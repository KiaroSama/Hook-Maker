name: Apply audited PR5 integration repair once
on:
  push:
    branches: [fix/review-20260920-evidence-delivery-install]
    paths: [.github/workflows/apply-pr5-integration-once.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'KiaroSama/Hook-Maker' && github.actor == 'KiaroSama'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply exact reviewed source corrections to this PR branch only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code aee6b31206f3c3139a04600224d0c17a44b3d4ff HEAD -- hooks scripts
          python - <<'PY'
          from pathlib import Path
          import subprocess
          # Git stores normalized LF blobs; the native evidence archive uses CRLF.
          expected = {
              'hooks/Skills-Check/Skills-Check.ps1': '8eab26bdfad790074d1085783b28f2c220e18e3d',
              'hooks/Cloudflare-Deploy/Cloudflare-Deploy.ps1': '464dff3402a3aac739f526aa8b283783dec052ac',
              'scripts/Test-CloudflareDeploy.ps1': '448a3bc2d4f218588ddc7161c9367af71b59f9da',
              'scripts/_testinstallregistrysafety.ps1': '7688216b0936400b3e5965fcd85bebd6fe585611',
              'scripts/Test-InstalledRuntimeMigration.ps1': '41d7f1891496bed9d8940a3a4acad0b4612984bf',
              'scripts/regression/Test-ReviewContracts.ps1': '5e781a15edefe74b3d99890b8509c8ccbb0a3dfa',
              'scripts/_testcloudflareownership.ps1': '89d3a505e696910344a9b745ef7c806a1ff51bbe',
          }
          for name, sha in expected.items():
              actual = subprocess.check_output(['git', 'rev-parse', 'HEAD:' + name], text=True).strip()
              if actual != sha:
                  raise RuntimeError('Source changed: ' + name + ' actual=' + actual)
          def replace(name, old, new, count=1):
              path = Path(name)
              raw = path.read_bytes()
              bom = raw.startswith(b'\xef\xbb\xbf')
              text = raw.decode('utf-8-sig').replace('\r\n', '\n')
              if text.count(old) != count:
                  raise RuntimeError(f'{name}: expected {count} exact targets, got {text.count(old)}')
              text = text.replace(old, new)
              newline = '\r\n' if b'\r\n' in raw else '\n'
              path.write_bytes((b'\xef\xbb\xbf' if bom else b'') + text.replace('\n', newline).encode('utf-8'))
          # Optional empty configuration is not a valid LiteralPath on Windows PowerShell.
          replace('hooks/Skills-Check/Skills-Check.ps1',
              '$hasLibrary = Test-Path -LiteralPath $libraryDir -PathType Container',
              "$hasLibrary = $false\nif (-not [string]::IsNullOrWhiteSpace($libraryDir)) {\n    $hasLibrary = Test-Path -LiteralPath $libraryDir -PathType Container -ErrorAction SilentlyContinue\n}")
          # Keep the independent consumer and its positive fixture complete.
          leaves = "@('_hooklib.ps1', '_stoplib.ps1', '_evidencelib.ps1', '_taskidentity.ps1', '_scope.ps1')"
          replace('hooks/Cloudflare-Deploy/Cloudflare-Deploy.ps1', leaves, leaves[:-1] + ", '_deliverylib.ps1')", count=2)
          replace('scripts/Test-CloudflareDeploy.ps1', "'_scope.ps1', 'Test-Temp-Cleanup.ps1')", "'_scope.ps1', '_deliverylib.ps1', 'Test-Temp-Cleanup.ps1')")
          replace('scripts/_testinstallregistrysafety.ps1',
              "'.hookmaker-runtime.json,_evidencelib.ps1,_hooklib.ps1,_scope.ps1,_stoplib.ps1,_taskidentity.ps1,zzz-standalone-hook.ps1'",
              "'.hookmaker-runtime.json,_deliverylib.ps1,_evidencelib.ps1,_hooklib.ps1,_scope.ps1,_stoplib.ps1,_taskidentity.ps1,zzz-standalone-hook.ps1'")
          for target in ('$FixtureHooksDir', '$hookDir'):
              replace('scripts/Test-InstalledRuntimeMigration.ps1',
                  "Copy-Item -LiteralPath $HookLib -Destination (Join-Path " + target + " '_hooklib.ps1') -Force",
                  "Copy-TestRuntimeLibraries -SourceHookLib $HookLib -Destination (Join-Path " + target + " '_hooklib.ps1')")
          # Preserve the actual host-specific historical failure, without hiding it.
          replace('scripts/regression/Test-ReviewContracts.ps1',
              '        $null=Invoke-ReviewHook $path $payload',
              "        $promptWire=Invoke-ReviewHook $path $payload\n        if ($name -eq 'Skills-Check') {\n            $legacyUnsetFails = $PSVersionTable.PSVersion.Major -le 5\n            Check-Contract 'E18 an unset optional library does not disable the Skills prompt consumer' {\n                $promptWire.Exit -eq 0 -and $promptWire.Err -eq '' -and $promptWire.Out -match 'Skills used:'\n            } $legacyUnsetFails\n        }")
          # Omission from both disk and metadata must be rejected on both clients.
          needle = "        [pscustomobject]@{\n            Name  = 'a required dependency deleted from disk AND from the manifest'"
          extra = "        [pscustomobject]@{\n            Name  = 'the delivery helper deleted from a Claude runtime AND its manifest'\n            Why   = 'the independent consumer must know the complete required runtime set'\n            Build = { param($Repo) New-ManagedCleanupInstall -Base $Repo -RemoveLeaf @('_deliverylib.ps1') | Out-Null }\n        }\n        [pscustomobject]@{\n            Name  = 'the delivery helper deleted from a Codex runtime AND its manifest'\n            Why   = 'Codex must enforce the same independently required dependency'\n            Build = { param($Repo) New-ManagedCleanupInstall -Base $Repo -Client 'codex' -RemoveLeaf @('_deliverylib.ps1') | Out-Null }\n        }\n"
          replace('scripts/_testcloudflareownership.ps1', needle, extra + needle)
          PY
          pwsh -NoProfile -Command '$bad = @(); Get-ChildItem hooks,scripts -Recurse -Filter *.ps1 | ForEach-Object { $e = $null; $null = [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e); $bad += $e }; if ($bad.Count) { $bad | Format-List; exit 1 }'
          git add hooks/Skills-Check/Skills-Check.ps1 hooks/Cloudflare-Deploy/Cloudflare-Deploy.ps1 scripts/Test-CloudflareDeploy.ps1 scripts/_testinstallregistrysafety.ps1 scripts/Test-InstalledRuntimeMigration.ps1 scripts/regression/Test-ReviewContracts.ps1 scripts/_testcloudflareownership.ps1
          git rm .github/workflows/apply-pr5-integration-once.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: preserve Skills with unset library and align installed delivery dependencies'
          git push origin HEAD:refs/heads/fix/review-20260920-evidence-delivery-install
