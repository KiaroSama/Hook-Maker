name: Complete storage test integration once
on:
  push:
    branches: [fix/audit-20260919-storage-integrity]
    paths: [.github/workflows/complete-storage-tests-once.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'KiaroSama/Hook-Maker' && github.actor == 'KiaroSama'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Integrate tests and remove one-shot mechanisms
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 36e05c7b7bfa182f6b6b6b149f11205d2842bab7 HEAD
          python - <<'PY'
          from pathlib import Path
          p=Path('hooks/Cross-Project-.ai-Knowledge-Sync/_packageguard.ps1')
          s=p.read_text(encoding='utf-8-sig')
          old="    $records = Get-Field $Pending 'stagedFiles'\n    if ($null -eq $Pending.PSObject.Properties['stagedFiles'] -or $records -isnot [System.Array]) { return $false }"
          new="    $property = $Pending.PSObject.Properties['stagedFiles']\n    if ($null -eq $property -or $property.Value -isnot [System.Array]) { return $false }\n    $records = $property.Value"
          assert old in s
          p.write_text(s.replace(old,new),encoding='utf-8',newline='\r\n')
          p=Path('.github/workflows/storage-integrity-regressions.yml')
          s=p.read_text()
          anchor='      - name: Record tested revision'
          assert anchor in s
          lines=[]
          for label,shell,out in [('PowerShell 7','pwsh','pwsh'),('Windows PowerShell 5.1','powershell','powershell')]:
              lines += ['      - name: Byte verification and publication failures ('+label+')', '        if: always()', '        shell: '+shell, '        run: ./scripts/regression/Test-PackagePublication.ps1 -ResultPath "$env:RUNNER_TEMP/storage-evidence/packages-'+out+'.json"']
          p.write_text(s.replace(anchor,'\n'.join(lines)+'\n'+anchor),encoding='utf-8')
          PY
          git add hooks/Cross-Project-.ai-Knowledge-Sync/_packageguard.ps1 .github/workflows/storage-integrity-regressions.yml
          git rm .github/workflows/apply-storage-once.yml .github/workflows/complete-storage-tests-once.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: preserve package array provenance and verify publish-before-retire on both Windows hosts'
          git push origin HEAD:refs/heads/fix/audit-20260919-storage-integrity
