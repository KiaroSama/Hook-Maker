name: Apply task integration once
on:
  push:
    branches: [fix/audit-20260919-task-finalization]
    paths: [.github/workflows/apply-task-integration-once.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'KiaroSama/Hook-Maker' && github.actor == 'KiaroSama'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply prepared edits and remove the one-shot mechanism
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 3eef0031dc4de3b833e6b7f92725794984f3d09a HEAD
          python .audit/integrate-task-fixes.py
          git add hooks scripts
          git rm .audit/integrate-task-fixes.py .github/workflows/apply-task-integration-once.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: preserve detector evidence identities and test complete installed-runtime payloads'
          git push origin HEAD:refs/heads/fix/audit-20260919-task-finalization
