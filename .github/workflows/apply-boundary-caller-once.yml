name: Apply identity-pinned caller once
on:
  push:
    branches: [fix/remaining-boundaries-20260920]
    paths: [.github/workflows/apply-boundary-caller-once.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'KiaroSama/Hook-Maker' && github.actor == 'KiaroSama'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Patch only the checked caller and remove this publisher
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:hooks/_hooklib.ps1)" = a57a65f4156fe8063a5c095db96a4903fc8588bd
          python - <<'PY'
          from pathlib import Path
          p=Path('hooks/_hooklib.ps1')
          raw=p.read_bytes(); bom=raw.startswith(b'\xef\xbb\xbf')
          s=raw.decode('utf-8-sig').replace('\r\n','\n')
          assert s.count('        $process.StandardInput.Close()') == 1
          assert s.count('Stop-ProcessTree -ProcessId $process.Id }') == 2
          s=s.replace('        $process.StandardInput.Close()', '        $ownedProcessCreated = $process.StartTime.ToUniversalTime()\n        $process.StandardInput.Close()',1)
          s=s.replace('Stop-ProcessTree -ProcessId $process.Id }','Stop-ProcessTree -ProcessId $process.Id -RootCreated $ownedProcessCreated }')
          old='param([int]$ProcessId, [int]$TimeoutMilliseconds = 0) if ($ProcessId'
          assert s.count(old)==1
          s=s.replace(old,'param([int]$ProcessId, [int]$TimeoutMilliseconds = 0, [object]$RootCreated = $null) if ($ProcessId')
          p.write_bytes((b'\xef\xbb\xbf' if bom else b'')+s.encode('utf-8'))
          PY
          pwsh -NoProfile -Command '$bad=@(); Get-ChildItem hooks,scripts -Recurse -Filter *.ps1 | ForEach-Object {$e=$null;$null=[Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$null,[ref]$e);$bad+=$e}; if($bad.Count){$bad|Format-List;exit 1}'
          git add hooks/_hooklib.ps1
          git rm .github/workflows/apply-boundary-caller-once.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: preserve owned process identity through command and inherited-pipe cleanup'
          git push origin HEAD:refs/heads/fix/remaining-boundaries-20260920
