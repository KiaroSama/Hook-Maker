name: Generation observation safety
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: generation-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        host: [pwsh, powershell]
        subject: [current, baseline]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare exact subject and evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'generation-evidence'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          $subject = $env:GITHUB_WORKSPACE
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Tested commit is unavailable.' }
          $sha | Set-Content -Encoding utf8 "$evidence/tested-commit.txt"
          if ('${{ matrix.subject }}' -eq 'baseline') {
            $sha = 'b6614ba1b47d82440bb62cb431077f87035b9f01'
            git -c protocol.version=2 fetch --no-tags --depth=1 origin $sha
            if ($LASTEXITCODE -ne 0) { throw 'Historical fetch failed.' }
            git archive --format=zip --output="$evidence/baseline.zip" $sha
            if ($LASTEXITCODE -ne 0) { throw 'Historical archive failed.' }
            $subject = Join-Path $env:GITHUB_WORKSPACE '.ci-work/generation-baseline'
            Expand-Archive -LiteralPath "$evidence/baseline.zip" -DestinationPath $subject
          }
          $sha | Set-Content -Encoding utf8 "$evidence/subject-commit.txt"
          "GENERATION_SUBJECT=$subject" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GENERATION_EVIDENCE=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Exercise actual production functions and real hook processes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $arguments = @('-NoLogo','-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File','./scripts/regression/Test-GenerationSafety.ps1','-SourceRoot',$env:GENERATION_SUBJECT,'-ResultPath',(Join-Path $env:GENERATION_EVIDENCE 'results.json'))
          if ('${{ matrix.subject }}' -eq 'baseline') { $arguments += '-ExpectBaselineFailures' }
          & '${{ matrix.host }}' @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Unexpected assertion or test exception.' }
          $report = Get-Content -LiteralPath "$env:GENERATION_EVIDENCE/results.json" -Raw | ConvertFrom-Json
          $expectedFailed = if ('${{ matrix.subject }}' -eq 'baseline') { 30 } else { 0 }
          if ($report.cases.Count -ne 37 -or $report.unexpected -ne 0 -or $report.failed -ne $expectedFailed) { throw 'Incomplete or unexpected native evidence.' }
          exit 0
      - name: Preserve source and verify historical workspace cleanup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'generation-evidence'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          git archive --format=zip --output="$evidence/source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Tested source archive failed.' }
          if ('${{ matrix.subject }}' -eq 'baseline') {
            . ./scripts/_testlib.ps1
            $subject = Join-Path $env:GITHUB_WORKSPACE '.ci-work/generation-baseline'
            if ((Test-Path -LiteralPath $subject) -and -not (Remove-TestWorkspace -Path $subject)) { throw 'Historical workspace cleanup failed.' }
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: generation-${{ matrix.host }}-${{ matrix.subject }}
          path: ${{ runner.temp }}/generation-evidence
          retention-days: 14
          if-no-files-found: error
