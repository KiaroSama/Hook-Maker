name: Repair generation native harness once
on:
  push:
    branches: [fix/generation-observation-retention-20260921]
    paths: [.github/workflows/repair-generation-harness-once.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'KiaroSama/Hook-Maker' && github.actor == 'KiaroSama'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Update the isolated test harness without changing product assertions
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 05282c14a1871e5b786705d1795eac3c314233f8 HEAD -- scripts/regression/Test-GenerationSafety.ps1
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/regression/Test-GenerationSafety.ps1')
          s=p.read_text(encoding='utf-8-sig')
          a=s.index('    $process = Start-BoundedProcess -FilePath $exe')
          b=s.index('\n}\nfunction Has-Publication',a)
          s=s[:a]+r'''    # Start-Process on 5.1 can return an exited wrapper with no ExitCode.
              # Retain the child handle ourselves, as the concurrent workers do.
              $start = New-Object Diagnostics.ProcessStartInfo
              $start.FileName = $exe
              $start.Arguments = ConvertTo-ProcessArgumentString @('-NoLogo', '-NoProfile', '-NonInteractive', '-File', (Join-Path $SourceRoot 'hooks\Session-Summary-Check\Session-Summary-Check.ps1'))
              $start.UseShellExecute = $false; $start.CreateNoWindow = $true
              $start.RedirectStandardInput = $true; $start.RedirectStandardOutput = $true; $start.RedirectStandardError = $true
              $process = [Diagnostics.Process]::Start($start)
              try {
                  $null = $process.Handle
                  $stdout = $process.StandardOutput.ReadToEndAsync(); $stderr = $process.StandardError.ReadToEndAsync()
                  $process.StandardInput.Write(($payload | ConvertTo-Json -Depth 8))
                  $process.StandardInput.Close()
                  if (-not $process.WaitForExit(20000)) { throw 'hook process timeout' }
                  if (-not $stdout.Wait(2000) -or -not $stderr.Wait(2000)) { throw 'hook pipe drain timeout' }
                  $answer = [pscustomobject]@{ Exit = $process.ExitCode; Out = $stdout.Result; Err = $stderr.Result }
                  if ($ResultPath -ne '') {
                      $tracePath = Join-Path (Split-Path -Parent $ResultPath) 'wire.jsonl'
                      [void][IO.Directory]::CreateDirectory((Split-Path -Parent $tracePath))
                      [IO.File]::AppendAllText($tracePath, (([ordered]@{ session = $payload.session_id; event = $payload.hook_event_name; wire = $answer } | ConvertTo-Json -Depth 6 -Compress) + "`n"), $utf8)
                  }
                  return $answer
              }
              finally {
                  if (-not $process.HasExited) { $process.Kill(); [void]$process.WaitForExit(5000) }
                  $process.Dispose()
              }'''.replace('\n          ','\n')+s[b:]
          anchor="try {\n    $h = New-Task 'wire-ordinary'"
          assert anchor in s
          replacement=r'''try {
              # Retain the original wrapper behavior as a diagnostic, not as a
              # passing product assertion or an expected-failure substitute.
              $probeExe = Join-Path $PSHOME $(if ($PSVersionTable.PSVersion.Major -le 5) { 'powershell.exe' } else { 'pwsh.exe' })
              $legacy = Start-BoundedProcess -FilePath $probeExe -ArgumentList @('-NoProfile','-Command','exit 7') -TimeoutMs 15000
              try {
                  $probe = [ordered]@{ requestedExit = 7; reportedExit = $legacy.ExitCode; hostVersion = $PSVersionTable.PSVersion.ToString() }
                  if ($ResultPath -ne '') {
                      [void][IO.Directory]::CreateDirectory((Split-Path -Parent $ResultPath))
                      [IO.File]::WriteAllText((Join-Path (Split-Path -Parent $ResultPath) 'legacy-process-probe.json'), ($probe | ConvertTo-Json), $utf8)
                  }
              }
              finally { $legacy.Dispose() }
              $h = New-Task 'wire-ordinary' '''.replace('\n          ','\n').rstrip()
          s=s.replace(anchor,replacement)
          p.write_text(s,encoding='utf-8')
          PY
          pwsh -NoProfile -Command '$e=$null; $null=[Management.Automation.Language.Parser]::ParseFile((Join-Path (Get-Location) "scripts/regression/Test-GenerationSafety.ps1"),[ref]$null,[ref]$e); if($e.Count){$e|Format-List;exit 1}'
          git add scripts/regression/Test-GenerationSafety.ps1
          git rm .github/workflows/repair-generation-harness-once.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test: retain real child exit codes on both hosts without weakening generation assertions'
          git push origin HEAD:refs/heads/fix/generation-observation-retention-20260921
