name: Materialize reviewed patch once
on:
  push:
    branches: [fix/review-20260920-evidence-delivery-install]
    paths: ['.review-transfer/**', '.github/workflows/materialize-review-once.yml']
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == 'KiaroSama/Hook-Maker' && github.actor == 'KiaroSama'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply exact reviewed bytes to the audited baseline
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code b0d1e030bec815892aacffa174bdfc5025fe2b98 HEAD -- hooks scripts docs .github/workflows/ci.yml
          python - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          encoded = ''.join(pathlib.Path(f'.review-transfer/{n}.b64').read_text() for n in range(5))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'adcdd0fb34c1cb7bf16fc53631576f5b04a3dc8abd8f060972f82baae6344a0f'
          subprocess.run(['git','apply','--check','--unidiff-zero','-'], input=patch, check=True)
          subprocess.run(['git','apply','--unidiff-zero','-'], input=patch, check=True)
          PY
          pwsh -NoProfile -Command '$bad = @(); Get-ChildItem hooks,scripts -Recurse -Filter *.ps1 | ForEach-Object { $e = $null; $null = [Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$null,[ref]$e); $bad += $e }; if ($bad.Count) { $bad | Format-List; exit 1 }'
          git add hooks scripts docs/audits/2026-09-20-review.md .github/workflows/review-contracts.yml
          git rm -r .review-transfer .github/workflows/materialize-review-once.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: close evidence, delivery, capacity and installer verdict gaps'
          git push origin HEAD:refs/heads/fix/review-20260920-evidence-delivery-install
