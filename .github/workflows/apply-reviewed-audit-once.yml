name: Apply consolidated task repair once
on:
  push:
    branches: [fix/audit-20260919-task-finalization]
    paths: [.audit/consolidate.py, .github/workflows/apply-reviewed-audit-once.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'KiaroSama/Hook-Maker' && github.actor == 'KiaroSama'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate exact source and apply the prepared edits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:.audit/consolidate.py)" = 2f6bf7750c85988f866cde19d08bacb24306cf65
          git diff --exit-code d37619c1d780a3467d976dfb92b56a563135512e HEAD -- hooks scripts
          python .audit/consolidate.py task
          pwsh -NoProfile -Command '$bad = @(); Get-ChildItem hooks,scripts -Recurse -Filter *.ps1 | ForEach-Object { $e = $null; $null = [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e); $bad += $e }; if ($bad.Count) { $bad | Format-List; exit 1 }'
          git add hooks scripts
          git rm .audit/consolidate.py .github/workflows/apply-reviewed-audit-once.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: close task replay and continuation gaps with complete integration assertions'
          git push origin HEAD:refs/heads/fix/audit-20260919-task-finalization
