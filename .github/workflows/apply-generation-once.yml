name: Apply prepared generation repair once
on:
  push:
    branches: [fix/generation-observation-retention-20260921]
    paths: [.github/workflows/apply-generation-once.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'KiaroSama/Hook-Maker' && github.actor == 'KiaroSama'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply only to the reviewed source and remove the publisher
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code b6614ba1b47d82440bb62cb431077f87035b9f01 HEAD -- hooks scripts/Setup-SyncGroupPresentation.ps1 scripts/_installeventmigration.ps1 scripts/Test-Generation.ps1 docs/HOOKS.md docs/HOOKS-FA.md CONTEXT.md
          python .audit/apply-generation.py
          pwsh -NoProfile -Command '$bad = @(); Get-ChildItem hooks,scripts -Recurse -Filter *.ps1 | ForEach-Object { $e = $null; $null = [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e); $bad += $e }; if ($bad.Count) { $bad | Format-List; exit 1 }'
          git add hooks scripts docs CONTEXT.md
          git rm .audit/apply-generation.py .github/workflows/apply-generation-once.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: observe real summaries and preserve unresolved generation identities'
          git push origin HEAD:refs/heads/fix/generation-observation-retention-20260921
