name: Apply prepared audit patch once
on:
  push:
    branches: [fix/audit-20260919-task-finalization]
    paths: [.audit/finalization.patch]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'KiaroSama/Hook-Maker' && github.actor == 'KiaroSama'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Apply only the reviewed patch to its own PR branch
        shell: bash
        run: |
          set -euo pipefail
          echo '52d7a54ee92c384c369a3d4d40dbf53b70ee596626dfcce5bdd217a26d366fe8  .audit/finalization.patch' | sha256sum --check
          test "$(git rev-parse HEAD:hooks/_hooklib.ps1)" = aa6d48f20d3da17ee489d8ef534fa5f2d7789aa1
          test "$(git rev-parse HEAD:hooks/_stoplib.ps1)" = e1a34df34e03c8062d40ab6a900a34b9cc4d9799
          test "$(git rev-parse HEAD:hooks/_taskidentity.ps1)" = 2c38058e1d5cca35df580e20fa3ebad140691e4a
          test "$(git rev-parse HEAD:scripts/Test-StopLedger.ps1)" = b26e13d5ba7d907fe81e0c2fa84c8a4714d31190
          git apply --check .audit/finalization.patch
          git apply --index .audit/finalization.patch
          git rm .audit/finalization.patch
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: validate ledger transactions and bound correction output across real task identities'
          git push origin HEAD:refs/heads/fix/audit-20260919-task-finalization
